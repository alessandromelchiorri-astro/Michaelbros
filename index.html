<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MichaelBros - 4 Livelli</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#69bff5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100vh;background:#69bff5}
#hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:0;right:0;z-index:10;display:flex;justify-content:space-between;gap:8px;padding:8px 12px;color:white;font-weight:900;text-shadow:0 2px 4px #000}
#hud span{white-space:nowrap}
#bossHud{position:fixed;top:48px;left:50%;transform:translateX(-50%);z-index:11;display:none;width:min(330px,70vw);color:#fff;font-weight:900;text-align:center;text-shadow:0 2px 3px #000}
#bossBar{height:14px;border:2px solid white;background:#222;border-radius:8px;overflow:hidden;margin-top:4px}
#bossFill{height:100%;width:100%;background:#e33}
#controls{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));z-index:12;display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px}
.cluster{display:flex;gap:10px}
button{appearance:none;border:3px solid white;background:#0006;color:white;border-radius:18px;min-width:76px;min-height:64px;font-size:25px;font-weight:900;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
button:active,.active{background:#fff5}
#jump{min-width:110px;background:#d94b43dd}
#overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#000a;color:white}
.panel{max-width:360px;text-align:center;padding:24px}
.panel h1{font-size:38px;margin:0 0 10px;letter-spacing:2px}
.panel p{line-height:1.4}
#start{min-width:170px;font-size:20px}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <span id="levelText">Livello: 1/8</span>
  <span id="scoreText">Punti: 0</span>
  <span id="coinText">Monete: 0</span>
  <span id="lifeText">Vite: 3</span>
</div>

<div id="invHud" style="position:fixed;top:48px;left:14px;z-index:11;display:none;color:#fff;font-weight:900;text-shadow:0 2px 3px #000">INVINCIBILE: <span id="invTime">0.0</span>s</div>
<div id="speedHud" style="position:fixed;top:72px;left:14px;z-index:11;display:none;color:#fff;font-weight:900;text-shadow:0 2px 3px #000">TURBO: <span id="speedTime">0.0</span>s</div>

<div id="bossHud">
  <span id="bossTitle">MINIBOSS</span>
  <div id="bossBar"><div id="bossFill"></div></div>
</div>

<div id="controls">
  <div class="cluster">
    <button id="left">←</button>
    <button id="right">→</button>
  </div>
  <button id="jump">SALTO</button>
</div>

<div id="overlay">
  <div class="panel">
    <h1 id="title">MichaelBros</h1>
    <p id="message">Otto livelli, un miniboss in ogni livello e un MEGABOSS finale. La pasta dà invincibilità e muscoli; l'hamburger dà supervelocità per 7 secondi; ogni due livelli trovi un gelato che dà una vita extra!</p>
    <button id="start">GIOCA</button><br><button id="soundBtn" style="margin-top:10px;min-width:170px;font-size:17px">🔊 ATTIVA SUONO</button>
  </div>
</div>

function createAudio(){
  try{
    if(!audioCtx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return false;
      audioCtx=new AC();
      masterGain=audioCtx.createGain();
      masterGain.gain.value=.75;
      masterGain.connect(audioCtx.destination);
    }
    return true;
  }catch(e){
    return false;
  }
}

async function unlockAudio(){
  if(!createAudio())return false;
  try{
    if(audioCtx.state!=='running')await audioCtx.resume();

    // Safari/iPhone: play a tiny buffer inside the user gesture to fully unlock audio.
    const buffer=audioCtx.createBuffer(1,1,audioCtx.sampleRate);
    const source=audioCtx.createBufferSource();
    source.buffer=buffer;
    source.connect(masterGain);
    source.start(0);

    return audioCtx.state==='running';
  }catch(e){
    return false;
  }
}

function playToneNow(freq,dur=.08,type='square',gain=.035){
  if(!audioCtx||audioCtx.state!=='running'||!masterGain)return;
  try{
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    const now=audioCtx.currentTime;
    o.type=type;
    o.frequency.setValueAtTime(freq,now);
    g.gain.setValueAtTime(Math.max(.001,gain*1.9),now);
    g.gain.exponentialRampToValueAtTime(.001,now+dur);
    o.connect(g);
    g.connect(masterGain);
    o.start(now);
    o.stop(now+dur+.03);
  }catch(e){}
}

function tone(freq,dur=.08,type='square',gain=.035){
  if(!soundEnabled)return;
  if(!createAudio())return;

  if(audioCtx.state==='running'){
    playToneNow(freq,dur,type,gain);
  }else{
    // Useful after an interruption; normally the context is already unlocked.
    audioCtx.resume().then(()=>{
      if(audioCtx.state==='running')playToneNow(freq,dur,type,gain);
    }).catch(()=>{});
  }
}

  ];
  for(const name of preferred){
    const v=voices.find(x=>x.name && x.name.toLowerCase().includes(name.toLowerCase()));
    if(v)return v;
  }
  // Prefer an English voice; avoid several commonly female Apple voice names.
  const avoid=['samantha','victoria','karen','moira','tessa','fiona','serena','ava'];
  return voices.find(v=>{
    const n=(v.name||'').toLowerCase();
    return /^en[-_]/i.test(v.lang||'') && !avoid.some(a=>n.includes(a));
  }) || voices.find(v=>/^en[-_]/i.test(v.lang||'')) || voices[0] || null;
}
function speakGame(text,rate,pitch){
  try{
    if(!('speechSynthesis' in window))return false;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const v=getGameVoice();
    if(v)u.voice=v;
    u.lang=(v&&v.lang)||'en-US';
    u.rate=rate;
    u.pitch=pitch;
    u.volume=1;
    speechSynthesis.speak(u);
    return true;
  }catch(e){return false;}
}

function updateVictoryCutscene(dt){
  cutsceneTime+=dt;

  // Fireworks become denser toward the end.
  const interval=cutsceneTime<3?1.0:(cutsceneTime<7?.72:.45);
  if(lastFireworkAt<0 || cutsceneTime-lastFireworkAt>interval){
    spawnFirework();
    lastFireworkAt=cutsceneTime;
  }

  for(const p of cutsceneFireworks){
    p.life-=dt;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=75*dt;
    p.vx*=Math.pow(.992,dt*60);
  }
  cutsceneFireworks=cutsceneFireworks.filter(p=>p.life>0);

  if(cutsceneTime>=10.5) winGame();
}


function drawItalianMoustache(cx,cy,w){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.fillStyle='#2b1a12';
  ctx.strokeStyle='#120b08';
  ctx.lineWidth=Math.max(1,w*.035);

  // Left half
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(-w*.10,-w*.10,-w*.28,-w*.10,-w*.43,-w*.01);
  ctx.bezierCurveTo(-w*.32,w*.02,-w*.20,w*.12,0,w*.055);
  ctx.closePath();
  ctx.fill();ctx.stroke();

  // Right half
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(w*.10,-w*.10,w*.28,-w*.10,w*.43,-w*.01);
  ctx.bezierCurveTo(w*.32,w*.02,w*.20,w*.12,0,w*.055);
  ctx.closePath();
  ctx.fill();ctx.stroke();

  ctx.restore();
}

  // smile

  ctx.moveTo(0,size*.30);

  ctx.bezierCurveTo(size*.48,-size*.55,size*.58,-size*.05,0,size*.30);
  ctx.closePath();
  ctx.fill();ctx.stroke();
  ctx.restore();
}

function resetBirdSchedule(){
  nextBirdAt=4+Math.random()*5;
  birdTimer=0;
  birdActive=false;
  eggActive=false;
}

function spawnBird(){
  if(currentLevel<3 || gameOverScene || transitionLock || cutsceneActive) return;
  birdActive=true;
  birdDropDone=false;
  birdTimer=0;
  const fromLeft=Math.random()<.5;
  birdY=70+Math.random()*90;
  birdX=fromLeft?-70:W+70;
  birdVX=fromLeft?(150+Math.random()*45):-(150+Math.random()*45);
}

function updateBird(dt){
  if(currentLevel<3 || !running || gameOverScene || transitionLock || cutsceneActive){
    birdActive=false;
    eggActive=false;
    return;
  }

  birdTimer+=dt;

  if(!birdActive && !eggActive && birdTimer>=nextBirdAt){
    spawnBird();
    birdTimer=0;
    nextBirdAt=5+Math.random()*7;
  }

  if(birdActive){
    birdX+=birdVX*dt;

    const px=player.x-camX+player.w/2;
    if(!birdDropDone && Math.abs(birdX-px)<70){
      birdDropDone=true;
      eggActive=true;
      eggX=birdX;
      eggY=birdY+20;
      eggVY=55;
    }

    if(birdX<-100 || birdX>W+100){
      birdActive=false;
    }
  }

  if(eggActive){
    eggVY+=520*dt;
    eggY+=eggVY*dt;

    const ex=eggX+camX;
    const hit = ex>player.x-8 && ex<player.x+player.w+8 &&
                eggY>player.y && eggY<player.y+player.h+10;
    if(hit){
      eggActive=false;
      loseLife();
      return;
    }

    if(eggY>H+40) eggActive=false;
  }
}

function resetCannon(){
  cannonUsed=false;
  shotActive=false;
  // Middle of the scrolling level.
  cannonX=worldW*.50;
  cannonY=groundY-42;
}

function fireCannon(){
  if(shotActive) return;
  cannonUsed=false;
  shotActive=true;

  // Start from the cannon muzzle in world coordinates.
  shotX=cannonX+8;
  shotY=cannonY-24;

  // Aim at the bird if it is on screen; otherwise shoot diagonally upward.
  if(birdActive){
    const targetWorldX=birdX+camX;
    const targetWorldY=birdY;
    const dx=targetWorldX-shotX;
    const dy=targetWorldY-shotY;
    const len=Math.max(1,Math.hypot(dx,dy));
    const speed=520;
    shotVX=dx/len*speed;
    shotVY=dy/len*speed;
  }else{
    shotVX=360;
    shotVY=-360;
  }

  // Short cannon blast.
  if(typeof playToneNow==='function'){
    playToneNow(110,.08,'square',.09);
    setTimeout(()=>playToneNow(70,.10,'square',.07),55);
  }
}

function updateCannon(dt){
  if(currentLevel<3) { shotActive=false; return; }
  if(!running || gameOverScene || transitionLock || cutsceneActive) return;

  // Touching the cannon fires it automatically.
  {
    const touching =
      player.x+player.w>cannonX-28 &&
      player.x<cannonX+28 &&
      player.y+player.h>cannonY-45 &&
      player.y<cannonY+28;
    if(touching && !shotActive) fireCannon();
  }

  if(shotActive){
    // Homing projectile: while the bird exists, continuously correct
    // the trajectory so the shot always reaches the moving target.
    if(birdActive){
      const birdWorldX=birdX+camX;
      const dx=birdWorldX-shotX;
      const dy=birdY-shotY;
      const dist=Math.max(1,Math.hypot(dx,dy));
      const speed=620;
      shotVX=dx/dist*speed;
      shotVY=dy/dist*speed;

      // If very close, snap to target to avoid skipping over it
      // between animation frames on fast devices.
      if(dist < speed*dt+18){
        shotX=birdWorldX;
        shotY=birdY;
      }else{
        shotX+=shotVX*dt;
        shotY+=shotVY*dt;
      }

      // Projectile can eliminate the currently flying bird.
      if(Math.abs(shotX-birdWorldX)<38 && Math.abs(shotY-birdY)<31){
        birdActive=false;
        eggActive=false;
        shotActive=false;

        // Remove the bird hazard for the rest of this level.
        nextBirdAt=999999;
        birdTimer=0;

        score+=400;
        setHud();
        if(typeof playToneNow==='function'){
          playToneNow(880,.08,'square',.07);
          setTimeout(()=>playToneNow(1175,.10,'square',.06),75);
        }
        return;
      }
    }else{
      shotX+=shotVX*dt;
      shotY+=shotVY*dt;
    }

    const sx=shotX-camX;
    if(sx<-80 || sx>W+80 || shotY<-80 || shotY>H+80){
      shotActive=false;
    }
  }
}

function drawCannon(){
  if(currentLevel<3) return;
  const sx=cannonX-camX;
  if(sx<-100 || sx>W+100) return;

  ctx.save();
  ctx.translate(sx,cannonY);

  // Wheels/base.
  ctx.fillStyle='#332f35';
  ctx.beginPath();ctx.arc(-19,14,13,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(19,14,13,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='#45424b';
  ctx.fillRect(-28,-2,56,19);

  // Barrel points upward toward the sky.
  ctx.save();
  ctx.rotate(-Math.PI*.32);
  ctx.fillStyle='#292a30';
  ctx.fillRect(-7,-48,14,52);
  ctx.fillStyle='#17181d';
  ctx.fillRect(-10,-51,20,10);
  ctx.restore();

  // Touch indicator before use.
  {
    const bob=Math.sin(animTime*5)*4;
    ctx.textAlign='center';
    ctx.font='bold 18px sans-serif';
    ctx.fillStyle='#fff';
    ctx.fillText('!',0,-66+bob);
  }

  ctx.restore();

  if(shotActive){
    const px=shotX-camX;
    ctx.save();
    ctx.translate(px,shotY);
    ctx.fillStyle='#25252a';
    ctx.beginPath();
    ctx.arc(0,0,8,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='rgba(255,210,90,.75)';
    ctx.beginPath();
    ctx.arc(-shotVX*.025,-shotVY*.025,4,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function update(dt){
  if(deathAnim>0)return;
  updateBird(dt);
  updateCannon(dt);
  jumpSquash=Math.max(0,jumpSquash-dt*4.4);
  landSquash=Math.max(0,landSquash-dt*6.5);
  landingDust=Math.max(0,landingDust-dt*2.8);
  for(const e of enemies){
    if(e.squashedTimer>0) e.squashedTimer=Math.max(0,e.squashedTimer-dt);
  }
  animTime += dt;
  if(cutsceneActive){updateVictoryCutscene(dt);return;}
  if(player.invuln>0)player.invuln-=dt;
  if(pastaInvuln>0){
    pastaInvuln=Math.max(0,pastaInvuln-dt);
    invHud.style.display='block';
    invTime.textContent=pastaInvuln.toFixed(1);
    if(pastaInvuln<=0){
      invHud.style.display='none';
      if(pastaMusic)restoreLevelMusic();
    }
  }
  if(speedBoost>0){
    speedBoost=Math.max(0,speedBoost-dt);
    speedHud.style.display='block';
    speedTime.textContent=speedBoost.toFixed(1);
    if(speedBoost<=0)speedHud.style.display='none';
  }
  if(boss&&boss.hitCooldown>0)boss.hitCooldown-=dt;
  if(boss&&boss.deadTimer>0)boss.deadTimer=Math.max(0,boss.deadTimer-dt);
  const oldY=player.y;

  const accel=speedBoost>0?1500:720;
  if(keys.left){player.vx-=accel*dt;player.face=-1}
  if(keys.right){player.vx+=accel*dt;player.face=1}
  if(!keys.left&&!keys.right)player.vx*=Math.pow(.82,dt*60);
  const maxSpeed=speedBoost>0?520:235;
  player.vx=Math.max(-maxSpeed,Math.min(maxSpeed,player.vx));
  if(keys.jump&&player.onGround){player.vy=-650; jumpSquash=1;player.onGround=false;sfxJump()}
  player.vy+=1000*dt;
  player.x+=player.vx*dt;player.x=Math.max(0,Math.min(worldW-player.w,player.x));
  player.y+=player.vy*dt;player.onGround=false;

  for(const p of platforms){
    if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldY+player.h<=p.y&&player.y+player.h>=p.y&&player.vy>=0){
      player.y=p.y-player.h;player.vy=0;player.onGround=true;
    }
  }
  for(const b of boxes){
    if(rectHit(player,b)){
      if(oldY>=b.y+b.h&&player.y<=b.y+b.h&&player.vy<0){
        player.y=b.y+b.h;player.vy=20;
        if(!b.hit){b.hit=true;score+=100;coins++;sfxCoin();setHud()}
      } else if(oldY+player.h<=b.y&&player.vy>=0){player.y=b.y-player.h;player.vy=0;player.onGround=true}
    }
  }
  if(player.y>H+250)loseLife();

  for(const e of enemies){
    if(e.squashedTimer>0) continue;
    if(!e.alive && e.squashedTimer<=0)continue;e.x+=e.vx*dt;
    let support=false;
    for(const p of platforms)if(e.x+e.w/2>p.x&&e.x+e.w/2<p.x+p.w&&Math.abs(e.y+e.h-p.y)<10)support=true;
    if(!support)e.vx*=-1;
    if(rectHit(player,e)){
      const stomp=player.vy>0&&oldY+player.h<=e.y+14;
      if(pastaInvuln>0){
        e.alive=false; e.squashedTimer=2.0;score+=250;sfxStomp();setHud();
      } else if(stomp){
        e.alive=false; e.squashedTimer=2.0;player.vy=-340;score+=200;sfxStomp();setHud();
      } else loseLife();
    }
  }

  for(const co of coinObjs){
    if(co.taken)continue;
    const cx=Math.max(player.x,Math.min(co.x,player.x+player.w));
    const cy=Math.max(player.y,Math.min(co.y,player.y+player.h));
    if(Math.hypot(co.x-cx,co.y-cy)<co.r+5){co.taken=true;coins++;score+=50;sfxCoin();setHud()}
  }

  // Un piatto di pasta per livello: 7 secondi di invincibilità
  for(const p of pastaObjs){
    if(p.taken)continue;
    const cx=Math.max(player.x,Math.min(p.x,player.x+player.w));
    const cy=Math.max(player.y,Math.min(p.y,player.y+player.h));
    if(Math.hypot(p.x-cx,p.y-cy)<p.r+8){
      p.taken=true;
      pastaInvuln=7;
      score+=300;
      sfxPasta();
      startPastaMusic();
      invHud.style.display='block';
      invTime.textContent='7.0';
      setHud();
    }
  }

  // Hamburger: supervelocità per 7 secondi
  for(const b of burgerObjs){
    if(b.taken)continue;
    const cx=Math.max(player.x,Math.min(b.x,player.x+player.w));
    const cy=Math.max(player.y,Math.min(b.y,player.y+player.h));
    if(Math.hypot(b.x-cx,b.y-cy)<b.r+8){
      b.taken=true; sayYes();
      speedBoost=7;
      score+=300;
      sfxBurger();
      speedHud.style.display='block';
      speedTime.textContent='7.0';
      setHud();
    }
  }

  // Gelato: una vita extra ogni due livelli
  for(const ic of iceCreamObjs){
    if(ic.taken)continue;
    const cx=Math.max(player.x,Math.min(ic.x,player.x+player.w));
    const cy=Math.max(player.y,Math.min(ic.y,player.y+player.h));
    if(Math.hypot(ic.x-cx,ic.y-cy)<ic.r+8){
      ic.taken=true;
      lives++;
      score+=500;
      sayYumYum(); sfxIceCream();
      setHud();
    }
  }

  if(goal&&(!boss||!boss.alive)&&player.x+player.w>goal.x)nextLevel();

  if(boss&&boss.alive){
    boss.x+=boss.vx*dt;
    if(boss.x<boss.arenaLeft||boss.x>worldW-120-boss.w)boss.vx*=-1;

    if(rectHit(player,boss)){
      const stomp=player.vy>0&&oldY+player.h<=boss.y+(boss.mega?55:28)&&boss.hitCooldown<=0;
      if(stomp){
        boss.hp--;
        boss.hitCooldown=boss.mega?.48:.60;
        player.vy=boss.mega?-500:-430;
        score+=boss.mega?800:450;
        sfxBossHit();
        bossFill.style.width=(100*boss.hp/boss.maxHp)+'%';
        setHud();

        if(boss.hp<=0){
          boss.alive=false;
          boss.deadTimer=boss.mega?2.0:1.35;
          bossHud.style.display='none';
          score+=boss.mega?5000:1500;
          setHud();
          if(boss.mega)setTimeout(startVictoryCutscene,1300);
          else sfxLevel();
        }
      } else if(boss.hitCooldown<=0) {
        loseLife();
      }
    }
  }

  camX=Math.max(0,Math.min(worldW-W,player.x-W*.36));

  if(prevPlayerVy>180 && Math.abs(player.vy)<1){
    landSquash=1;
    landingDust=1;
    landingDustX=player.x+player.w/2;
    landingDustY=player.y+player.h-2;
  }
  prevPlayerVy=player.vy;
  jumpTilt += (((Math.max(-1,Math.min(1,player.vx/220)))*0.10) - jumpTilt) * Math.min(1,dt*8);
}

function drawFace(img,x,y,w,h){
  if(!img.complete)return;ctx.save();ctx.beginPath();ctx.arc(x+w/2,y+h/2,Math.min(w,h)/2,0,Math.PI*2);ctx.clip();ctx.drawImage(img,x,y,w,h);ctx.restore();
}



function drawParallaxLandscape(){
  // Camera follows player; background layers move more slowly than foreground.
  const camX = Math.max(0, player.x - W*0.34);

  ctx.save();

  // Very distant blue mountains
  const far = -(camX*0.08)%520;
  ctx.fillStyle='rgba(105,165,190,.34)';
  for(let k=-1;k<4;k++){
    const x=far+k*520;
    ctx.beginPath();
    ctx.moveTo(x, H*.70);
    ctx.lineTo(x+115,H*.43);
    ctx.lineTo(x+210,H*.65);
    ctx.lineTo(x+310,H*.38);
    ctx.lineTo(x+430,H*.67);
    ctx.lineTo(x+520,H*.52);
    ctx.lineTo(x+520,H*.78);
    ctx.lineTo(x,H*.78);
    ctx.closePath();
    ctx.fill();
  }

  // Far rolling hills
  const mid = -(camX*0.16)%620;
  ctx.fillStyle='rgba(92,174,105,.48)';
  for(let k=-1;k<4;k++){
    const x=mid+k*620;
    ctx.beginPath();
    ctx.moveTo(x,H*.79);
    ctx.bezierCurveTo(x+90,H*.55,x+210,H*.55,x+300,H*.73);
    ctx.bezierCurveTo(x+385,H*.53,x+520,H*.58,x+620,H*.75);
    ctx.lineTo(x+620,H*.88);
    ctx.lineTo(x,H*.88);
    ctx.closePath();
    ctx.fill();
  }

  // Near hills
  const near = -(camX*0.27)%760;
  ctx.fillStyle='rgba(55,151,78,.58)';
  for(let k=-1;k<4;k++){
    const x=near+k*760;
    ctx.beginPath();
    ctx.moveTo(x,H*.88);
    ctx.bezierCurveTo(x+130,H*.65,x+260,H*.67,x+365,H*.83);
    ctx.bezierCurveTo(x+470,H*.62,x+620,H*.67,x+760,H*.84);
    ctx.lineTo(x+760,H*.94);
    ctx.lineTo(x,H*.94);
    ctx.closePath();
    ctx.fill();
  }

  // Distant castle: moves very slowly, so it feels far away.
  // Castle belongs to the end of the level and is anchored to its own hill.
  const levelEndX = (typeof goal !== 'undefined' && goal && Number.isFinite(goal.x)) ? goal.x : 2600;
  const castleWorldX = levelEndX - 210;
  const cx = castleWorldX - camX;

  // Fixed ground line for castle base.
  const castleGroundY = H*.78;
  const cy = castleGroundY - 122;
  ctx.globalAlpha=.78;

  // Castle hill: broad, solid and drawn exactly under the building.

function drawDeathAnimation(){
  if(deathAnim<=0) return;

  const total=1.45;
  const p=Math.max(0,Math.min(1,(total-deathAnim)/total));

  // Keep the animation in screen coordinates at the exact place where Michael died.
  const cx=deathAnimX-camX;
  const cy=deathAnimY - 85*p + 145*p*p;
  const angle=p*Math.PI*6; // three complete spins

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(angle);

  // Make the whole protagonist clearly visible while spinning.
  const w=player.w, h=player.h;
  const bodyY=-h/2+18;

  // legs
  ctx.strokeStyle='#26344d';
  ctx.lineWidth=8;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-9,bodyY+37);ctx.lineTo(-14,bodyY+55);
  ctx.moveTo(9,bodyY+37);ctx.lineTo(14,bodyY+55);
  ctx.stroke();

  // body
  ctx.fillStyle='#2d65b0';
  ctx.fillRect(-17,bodyY+10,34,34);

  // arms spread out to make the spin obvious
  ctx.strokeStyle='#f0b28f';
  ctx.lineWidth=7;
  ctx.beginPath();
  ctx.moveTo(-15,bodyY+18);ctx.lineTo(-31,bodyY+5);
  ctx.moveTo(15,bodyY+18);ctx.lineTo(31,bodyY+5);
  ctx.stroke();

  // head with Michael's face
  ctx.save();
  ctx.beginPath();
  ctx.arc(0,bodyY,23,0,Math.PI*2);
  ctx.clip();
  drawFace(heroFace,-23,bodyY-23,46,46);
  ctx.restore();

  // white outline flashes during the spin
  if(Math.floor(p*12)%2===0){
    ctx.strokeStyle='rgba(255,255,255,.8)';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(0,bodyY,26,0,Math.PI*2);
    ctx.stroke();
  }

  ctx.restore();

  // spinning stars around him
  ctx.save();
  ctx.globalAlpha=1-p*.5;
  ctx.fillStyle='#ffd84a';
  for(let i=0;i<5;i++){
    const a=angle+i*Math.PI*2/5;
    const r=38+10*Math.sin(p*Math.PI);
    const x=cx+Math.cos(a)*r;
    const y=cy-15+Math.sin(a)*r;
    ctx.beginPath();
    ctx.arc(x,y,3.5,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  if(cutsceneActive){drawVictoryCutscene();return;}
  const palettes=[
    ['#69bff5','#5dbb43','#7a4f2b'],
    ['#7fc8ff','#5aaf50','#76522d'],
    ['#a2b7ff','#4d9b50','#6d4c36'],
    ['#ffaf63','#3f8344','#5f4330']
  ];
  const pal=palettes[(currentLevel-1)%palettes.length];
  ctx.fillStyle=pal[0];ctx.fillRect(0,0,W,H);
  drawExtraBackground();

  ctx.fillStyle='rgba(255,255,255,.85)';
  for(let i=0;i<8;i++){
    let x=(i*540-camX*.18)%4300,y=75+(i%3)*55;
    ctx.beginPath();ctx.arc(x,y,28,0,Math.PI*2);ctx.arc(x+30,y+6,22,0,Math.PI*2);ctx.arc(x-28,y+8,20,0,Math.PI*2);ctx.fill();
  }

  ctx.save();ctx.translate(-camX,0);
  for(const p of platforms){
    ctx.fillStyle=pal[2];ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle=pal[1];ctx.fillRect(p.x,p.y,p.w,13);
  }
  for(const b of boxes){
    ctx.fillStyle=b.hit?'#8b6c4a':'#d79b28';ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle='#6c4a16';ctx.lineWidth=3;ctx.strokeRect(b.x,b.y,b.w,b.h);
    if(!b.hit){ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.fillText('?',b.x+13,b.y+29)}
  }
  for(const co of coinObjs){
    if(co.taken)continue;ctx.fillStyle='#ffd43b';ctx.beginPath();ctx.ellipse(co.x,co.y,7,12,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#b57e00';ctx.stroke();
  }

  // Piatto di pasta
  for(const p of pastaObjs){
    if(p.taken)continue;
    ctx.save();
    const bob=Math.sin(animTime*4+p.x*.01)*3;
    ctx.translate(p.x,p.y+bob);
    // piatto
    ctx.fillStyle='#f5f5f5';
    ctx.beginPath();ctx.ellipse(0,8,25,9,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#bbb';ctx.lineWidth=2;ctx.stroke();
    // spaghetti
    ctx.strokeStyle='#f0c84b';ctx.lineWidth=4;ctx.lineCap='round';
    for(let i=-14;i<=14;i+=7){
      ctx.beginPath();
      ctx.moveTo(i,3);
      ctx.bezierCurveTo(i+8,-8,i-8,-12,i+2,-18);
      ctx.stroke();
    }
    // salsa
    ctx.fillStyle='#d94b3d';
    ctx.beginPath();ctx.arc(-4,-8,4,0,Math.PI*2);ctx.arc(5,-10,4,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // Hamburger turbo
  for(const b of burgerObjs){
    if(b.taken)continue;
    ctx.save();
    const bob=Math.sin(animTime*5+b.x*.012)*3;
    ctx.translate(b.x,b.y+bob);
    ctx.fillStyle='#d99a3a';
    ctx.beginPath();ctx.arc(0,-7,23,Math.PI,0);ctx.lineTo(23,-2);ctx.lineTo(-23,-2);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff2bd';
    for(const sx of [-12,-4,5,13]){ctx.beginPath();ctx.ellipse(sx,-14+(sx%3),2,1,0,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#4ea94e';ctx.fillRect(-22,-2,44,5);
    ctx.fillStyle='#ffd83d';ctx.fillRect(-20,3,40,5);
    ctx.fillStyle='#6e3b23';ctx.fillRect(-21,8,42,8);
    ctx.fillStyle='#d99a3a';ctx.beginPath();ctx.ellipse(0,17,22,7,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // Gelato vita extra
  for(const ic of iceCreamObjs){
    if(ic.taken)continue;
    ctx.save();
    const bob=Math.sin(animTime*4.5+ic.x*.01)*3;
    ctx.translate(ic.x,ic.y+bob);

    // cone
    ctx.fillStyle='#c98a4a';
    ctx.beginPath();
    ctx.moveTo(-11,3);
    ctx.lineTo(11,3);
    ctx.lineTo(0,27);
    ctx.closePath();
    ctx.fill();

    // cone lines
    ctx.strokeStyle='#8d5f32';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(-7,7);ctx.lineTo(6,21);
    ctx.moveTo(7,7);ctx.lineTo(-4,21);
    ctx.stroke();

    // scoops
    ctx.fillStyle='#f4a6c1';
    ctx.beginPath();ctx.arc(-8,-5,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#f7e27d';
    ctx.beginPath();ctx.arc(7,-5,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#c58a63';
    ctx.beginPath();ctx.arc(0,-14,10,0,Math.PI*2);ctx.fill();

    // sparkle
    ctx.strokeStyle='#fff';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(20,-18);ctx.lineTo(20,-8);
    ctx.moveTo(15,-13);ctx.lineTo(25,-13);
    ctx.stroke();

    ctx.restore();
  }

  for(const e of enemies){
    if(!e.alive && !(e.squashedTimer>0)) continue;

    // Same face, slightly different monster body depending on its position.
    const monsterVariant=Math.abs(Math.floor((e.x+e.y*3)/97))%4;

    // For two seconds after being stomped, draw only the flattened body.
    if(e.squashedTimer>0){
      const squashH=15;
      const sx=e.x+e.w/2;
      const sy=e.y+e.h-squashH/2;

      ctx.save();

      // flattened shadow/body
      ctx.fillStyle='#5a2f20';
      ctx.beginPath();
      ctx.ellipse(sx,sy+5,e.w*.50,squashH*.48,0,0,Math.PI*2);
      ctx.fill();

      // flattened enemy face
      drawFace(enemyFace,e.x+4,e.y+e.h-18,e.w-8,16);

      // X eyes, deliberately visible over the photo
      ctx.strokeStyle='#111';
      ctx.lineWidth=3;
      const eyeY=e.y+e.h-12;
      for(const eyeX of [e.x+e.w*.35,e.x+e.w*.65]){
        ctx.beginPath();
        ctx.moveTo(eyeX-4,eyeY-4); ctx.lineTo(eyeX+4,eyeY+4);
        ctx.moveTo(eyeX+4,eyeY-4); ctx.lineTo(eyeX-4,eyeY+4);
        ctx.stroke();
      }

      // tiny "squash" bounce during the first instant
      if(e.squashedTimer>1.65){
        ctx.strokeStyle='rgba(255,255,255,.8)';
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(sx-22,sy-18);ctx.lineTo(sx-30,sy-26);
        ctx.moveTo(sx+22,sy-18);ctx.lineTo(sx+30,sy-26);
        ctx.stroke();
      }

      ctx.restore();
      continue;
    }

    const moving=Math.abs(e.vx)>5;
    const phase=moving ? Math.sin(animTime*10 + e.x*.03) : 0;
    const legSwing=phase*7;
    const armSwing=-phase*5;

    // Four body silhouettes, all keeping exactly the same face.
    ctx.save();

    if(monsterVariant===0){
      // Classic round monster
      ctx.fillStyle='#713d23';
      ctx.beginPath();
      ctx.ellipse(e.x+e.w/2,e.y+40,(e.w-18)/2,13,0,0,Math.PI*2);
      ctx.fill();
    }else if(monsterVariant===1){
      // Short, wide monster
      ctx.fillStyle='#874728';
      ctx.beginPath();
      ctx.roundRect(e.x+7,e.y+33,e.w-14,16,8);
      ctx.fill();
      // tiny side spikes
      ctx.fillStyle='#5d321f';
      ctx.beginPath();
      ctx.moveTo(e.x+8,e.y+37);ctx.lineTo(e.x,e.y+42);ctx.lineTo(e.x+9,e.y+45);
      ctx.moveTo(e.x+e.w-8,e.y+37);ctx.lineTo(e.x+e.w,e.y+42);ctx.lineTo(e.x+e.w-9,e.y+45);
      ctx.fill();
    }else if(monsterVariant===2){
      // Taller monster with a dark belt
      ctx.fillStyle='#68402b';
      ctx.fillRect(e.x+13,e.y+28,e.w-26,23);
      ctx.fillStyle='#34251d';
      ctx.fillRect(e.x+11,e.y+40,e.w-22,5);
    }else{
      // Purple armored monster
      ctx.fillStyle='#66508d';
      ctx.beginPath();
      ctx.roundRect(e.x+9,e.y+30,e.w-18,21,6);
      ctx.fill();
      ctx.fillStyle='#8d78b2';
      ctx.beginPath();
      ctx.moveTo(e.x+11,e.y+31);ctx.lineTo(e.x+17,e.y+22);ctx.lineTo(e.x+22,e.y+31);
      ctx.moveTo(e.x+e.w-22,e.y+31);ctx.lineTo(e.x+e.w-17,e.y+22);ctx.lineTo(e.x+e.w-11,e.y+31);
      ctx.fill();
    }

    // Arms vary slightly with monster type.
    ctx.strokeStyle=monsterVariant===3?'#51406f':'#713d23';
    ctx.lineWidth=monsterVariant===1?8:7;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(e.x+13,e.y+34);
    ctx.lineTo(e.x+5,e.y+41+armSwing);
    ctx.moveTo(e.x+e.w-13,e.y+34);
    ctx.lineTo(e.x+e.w-5,e.y+41-armSwing);
    ctx.stroke();

    // Legs/feet: different stance, same gameplay hitbox.
    ctx.strokeStyle='#3b2417';
    ctx.lineWidth=8;
    ctx.beginPath();
    const stance=monsterVariant===1?5:(monsterVariant===2?-2:0);
    ctx.moveTo(e.x+19,e.y+46);
    ctx.lineTo(e.x+16-legSwing-stance,e.y+55);
    ctx.moveTo(e.x+e.w-19,e.y+46);
    ctx.lineTo(e.x+e.w-16+legSwing+stance,e.y+55);
    ctx.stroke();

    // Small distinguishing accessory, without covering the face.
    if(monsterVariant===1){
      ctx.fillStyle='#d8b64c';
      ctx.fillRect(e.x+7,e.y+47,10,4);
      ctx.fillRect(e.x+e.w-17,e.y+47,10,4);
    }else if(monsterVariant===2){
      ctx.fillStyle='#d8d8d8';
      ctx.beginPath();
      ctx.moveTo(e.x+8,e.y+31);ctx.lineTo(e.x+14,e.y+22);ctx.lineTo(e.x+17,e.y+33);
      ctx.fill();
    }else if(monsterVariant===3){
      ctx.strokeStyle='#d5c6ef';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(e.x+e.w/2,e.y+39,13,0,Math.PI);
      ctx.stroke();
    }

    ctx.restore();

    drawFace(enemyFace,e.x+2,e.y,48,48);
  }
  if(goal&&(!boss||!boss.alive)){
    ctx.fillStyle='#eee';ctx.fillRect(goal.x,goal.y,goal.w,goal.h);
    ctx.fillStyle='#2d8f3a';ctx.beginPath();ctx.moveTo(goal.x+goal.w,goal.y+10);ctx.lineTo(goal.x+88,goal.y+35);ctx.lineTo(goal.x+goal.w,goal.y+60);ctx.closePath();ctx.fill();
  }

  if(boss&&(boss.alive||boss.deadTimer>0)){
    const s=boss.w/120;
    const dead=!boss.alive;
    ctx.save();
    ctx.translate(boss.x,boss.y);

    // shadow
    ctx.fillStyle='rgba(0,0,0,.22)';
    ctx.beginPath();
    ctx.ellipse(boss.w/2,boss.h+5,boss.w*.42,11*s,0,0,Math.PI*2);
    ctx.fill();

    // Each miniboss has a different silhouette.
    ctx.fillStyle=boss.mega?'#4b1738':['#73401f','#355c8a','#6b3c7a','#47733a','#8a5a2b','#7f3333','#3c6f73'][boss.shape];

    if(boss.mega){
      // Mega boss: huge rounded monster
      ctx.beginPath();
      ctx.ellipse(boss.w/2,boss.h*.64,boss.w*.46,boss.h*.36,0,0,Math.PI*2);
      ctx.fill();
    } else if(boss.shape===0){
      // Round
      ctx.beginPath();
      ctx.arc(boss.w/2,boss.h*.59,boss.w*.43,0,Math.PI*2);
      ctx.fill();
    } else if(boss.shape===1){
      // Tall / rectangular
      ctx.beginPath();
      ctx.roundRect(boss.w*.18,boss.h*.22,boss.w*.64,boss.h*.65,14*s);
      ctx.fill();
    } else if(boss.shape===2){
      // Triangle / pyramid
      ctx.beginPath();
      ctx.moveTo(boss.w/2,boss.h*.14);
      ctx.lineTo(boss.w*.91,boss.h*.88);
      ctx.lineTo(boss.w*.09,boss.h*.88);
      ctx.closePath();
      ctx.fill();
    } else if(boss.shape===3){
      // Wide / squat
      ctx.beginPath();
      ctx.ellipse(boss.w/2,boss.h*.68,boss.w*.49,boss.h*.27,0,0,Math.PI*2);
      ctx.fill();
    } else if(boss.shape===4){
      // Diamond
      ctx.beginPath();
      ctx.moveTo(boss.w/2,boss.h*.08);
      ctx.lineTo(boss.w*.92,boss.h*.52);
      ctx.lineTo(boss.w/2,boss.h*.94);
      ctx.lineTo(boss.w*.08,boss.h*.52);
      ctx.closePath();
      ctx.fill();
    } else if(boss.shape===5){
      // Two-lobed monster
      ctx.beginPath();
      ctx.arc(boss.w*.34,boss.h*.58,boss.w*.29,0,Math.PI*2);
      ctx.arc(boss.w*.66,boss.h*.58,boss.w*.29,0,Math.PI*2);
      ctx.fill();
    } else {
      // Spiky blob
      ctx.beginPath();
      for(let i=0;i<16;i++){
        const a=(Math.PI*2*i)/16-Math.PI/2;
        const r=(i%2===0?boss.w*.46:boss.w*.34);
        const x=boss.w/2+Math.cos(a)*r;
        const y=boss.h*.58+Math.sin(a)*r*.82;
        if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.fill();
    }

    // Colored belly / armor, adapted to shape.
    if(!dead){
      ctx.fillStyle=boss.mega?'#c43c35':'rgba(255,255,255,.16)';
      ctx.beginPath();
      ctx.ellipse(boss.w/2,boss.h*.65,boss.w*.30,boss.h*.20,0,0,Math.PI*2);
      ctx.fill();
    }

    // horns/spikes while alive
    if(!dead){
      ctx.fillStyle='#eee';
      const spikes=boss.mega?6:3+(boss.level%3);
      for(let i=0;i<spikes;i++){
        const xx=boss.w*.18+i*(boss.w*.64/Math.max(1,spikes-1));
        ctx.beginPath();
        ctx.moveTo(xx-7*s,boss.h*.30);
        ctx.lineTo(xx,boss.h*.10-(i%2)*7*s);
        ctx.lineTo(xx+7*s,boss.h*.30);
        ctx.fill();
      }
    }

    // Face picture stays, but KO overlays replace the eyes/mouth.
    drawFace(enemyFace,boss.w*.19,boss.h*.08,boss.w*.62,boss.w*.62);

    if(dead){
      // pale KO overlay
      ctx.fillStyle='rgba(255,255,255,.15)';
      ctx.beginPath();
      ctx.ellipse(boss.w/2,boss.h*.38,boss.w*.31,boss.h*.25,0,0,Math.PI*2);
      ctx.fill();

      // crossed eyes
      ctx.strokeStyle='#111';
      ctx.lineWidth=Math.max(4,5*s);
      ctx.lineCap='round';
      const ey=boss.h*.34;
      const ex1=boss.w*.39, ex2=boss.w*.61, d=7*s;
      ctx.beginPath();
      ctx.moveTo(ex1-d,ey-d);ctx.lineTo(ex1+d,ey+d);
      ctx.moveTo(ex1+d,ey-d);ctx.lineTo(ex1-d,ey+d);
      ctx.moveTo(ex2-d,ey-d);ctx.lineTo(ex2+d,ey+d);
      ctx.moveTo(ex2+d,ey-d);ctx.lineTo(ex2-d,ey+d);
      ctx.stroke();

      // open mouth
      ctx.fillStyle='#23120f';
      ctx.beginPath();
      ctx.ellipse(boss.w/2,boss.h*.55,boss.w*.13,boss.h*.075,0,0,Math.PI*2);
      ctx.fill();

      // tongue sticking out
      ctx.fillStyle='#e86b86';
      ctx.beginPath();
      ctx.roundRect(boss.w*.46,boss.h*.55,boss.w*.08,boss.h*.16,6*s);
      ctx.fill();
      ctx.strokeStyle='#9f3d55';
      ctx.lineWidth=2*s;
      ctx.beginPath();
      ctx.moveTo(boss.w/2,boss.h*.60);
      ctx.lineTo(boss.w/2,boss.h*.69);
      ctx.stroke();

      // little stars circling the KO boss
      ctx.fillStyle='#ffd84d';
      for(let i=0;i<3;i++){
        const a=animTime*3+i*2.1;
        const sx=boss.w/2+Math.cos(a)*boss.w*.38;
        const sy=boss.h*.12+Math.sin(a)*boss.h*.08;
        ctx.save();
    const airborne=Math.abs(player.vy)>8;
    const jumpStretchY=airborne ? (1+Math.min(.18,Math.abs(player.vy)/750)) : 1;
    const takeoffScaleX=1-jumpSquash*.14;
    const takeoffScaleY=1+jumpSquash*.20;
    const landScaleX=1+landSquash*.22;
    const landScaleY=1-landSquash*.20;
    const heroCx=player.x+player.w/2;
    const heroCy=player.y+player.h/2;
    ctx.translate(heroCx,heroCy);
    ctx.rotate(airborne ? jumpTilt*.65 : 0);
    ctx.scale(takeoffScaleX*landScaleX,(jumpStretchY*takeoffScaleY)*landScaleY);
    ctx.translate(-heroCx,-heroCy);

        ctx.translate(sx,sy);
        ctx.rotate(a);
        ctx.fillRect(-3*s,-9*s,6*s,18*s);
        ctx.fillRect(-9*s,-3*s,18*s,6*s);
        ctx.restore();
      }
    } else if(boss.mega){
      ctx.strokeStyle='#ffd84d';
      ctx.lineWidth=5;
      ctx.beginPath();
      ctx.arc(boss.w/2,boss.h*.35,boss.w*.39+Math.sin(animTime*6)*5,0,Math.PI*2);
      ctx.stroke();
    }

    ctx.restore();
  }

  // protagonista con braccia e gambe animate
  const heroMoving=Math.abs(player.vx)>12 && player.onGround;
  const heroPhase=heroMoving ? Math.sin(animTime*12) : 0;
  const heroLeg=heroPhase*9;
  const heroArm=-heroPhase*8;

  // torso: diventa più largo e muscoloso con la pasta
  if(pastaInvuln>0){
    ctx.fillStyle='#d94335';
    ctx.beginPath();
    ctx.roundRect(player.x+7,player.y+46,50,25,8);
    ctx.fill();
    ctx.fillStyle='#2c63d8';
    ctx.fillRect(player.x+13,player.y+65,38,16);

    // braccia piegate in posa da culturista
    ctx.strokeStyle='#d94335';
    ctx.lineWidth=10;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(player.x+12,player.y+53);
    ctx.lineTo(player.x+1,player.y+61);
    ctx.lineTo(player.x+7,player.y+45);
    ctx.moveTo(player.x+52,player.y+53);
    ctx.lineTo(player.x+63,player.y+61);
    ctx.lineTo(player.x+57,player.y+45);
    ctx.stroke();

    // bicipiti
    ctx.fillStyle='#d94335';
    ctx.beginPath();
    ctx.arc(player.x+3,player.y+57,9,0,Math.PI*2);
    ctx.arc(player.x+61,player.y+57,9,0,Math.PI*2);
    ctx.fill();

    // guanti
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(player.x+7,player.y+43,6,0,Math.PI*2);
    ctx.arc(player.x+57,player.y+43,6,0,Math.PI*2);
    ctx.fill();
  } else {
    ctx.fillStyle='#d94335';
    ctx.fillRect(player.x+14,player.y+49,36,16);
    ctx.fillStyle='#2c63d8';
    ctx.fillRect(player.x+14,player.y+61,36,18);

    // arms
    ctx.strokeStyle='#d94335';
    ctx.lineWidth=8;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(player.x+16,player.y+55);
    ctx.lineTo(player.x+6,player.y+66+heroArm);
    ctx.moveTo(player.x+48,player.y+55);
    ctx.lineTo(player.x+58,player.y+66-heroArm);
    ctx.stroke();

    // white gloves
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(player.x+6,player.y+66+heroArm,5,0,Math.PI*2);
    ctx.arc(player.x+58,player.y+66-heroArm,5,0,Math.PI*2);
    ctx.fill();
  }

  // legs
  ctx.strokeStyle='#2c63d8';
  ctx.lineWidth=9;
  ctx.beginPath();
  ctx.moveTo(player.x+24,player.y+76);
  ctx.lineTo(player.x+20-heroLeg,player.y+87);
  ctx.moveTo(player.x+40,player.y+76);
  ctx.lineTo(player.x+44+heroLeg,player.y+87);
  ctx.stroke();

  // shoes
  ctx.fillStyle='#6b3e1e';
  ctx.beginPath();
  ctx.ellipse(player.x+18-heroLeg,player.y+88,9,4,0,0,Math.PI*2);
  ctx.ellipse(player.x+46+heroLeg,player.y+88,9,4,0,0,Math.PI*2);
  ctx.fill();

  if(player.invuln<=0||Math.floor(player.invuln*10)%2===0)
    drawFace(heroFace,player.x,player.y-2,64,64);
    if(pastaInvuln>0) drawItalianMoustache((player.x)+(64)*.5,(player.y-2)+(64)*.67,(64)*.72);
  ctx.restore();
  if(landingDust>0){
    ctx.save();
    const d=landingDust;
    const age=1-d;
    ctx.globalAlpha=Math.min(0.75,d);

    // Dust stays where the feet touched the ground.
    const spread=10+age*30;
    const rise=age*9;
    const puffR=3+age*4;

    ctx.fillStyle='rgba(230,220,190,.82)';
    for(const side of [-1,1]){
      for(let j=0;j<3;j++){
        const off=side*(8+j*7+spread*.35);
        const yoff=(j%2)*3-rise;
        ctx.beginPath();
        ctx.arc(landingDustX+off,landingDustY+yoff,puffR-j*.45,0,Math.PI*2);
        ctx.fill();
      }
    }
    ctx.restore();
  }


  drawCannon();

  drawDeathAnimation();

  drawGameOverScene();
  drawIntroScene();

  drawBirdAndEgg();
}

function loop(t){
  if(!running && !gameOverScene && !introSceneActive)return;
  const dt=Math.min(.033,(t-last)/1000||0);
  last=t;
  if(running) update(dt);
  draw();
  requestAnimationFrame(loop);
}

function startFresh(){
  resetBirdSchedule();
  gameOverScene=false; gameOverSceneTime=0;
  introSceneActive=false; introSceneTime=0;
  if(introSceneTimer){clearTimeout(introSceneTimer);introSceneTimer=null;}
  cutsceneActive=false;cutsceneTime=0;cutsceneFireworks=[];stopVictoryMusic();
  createAudio();score=0;coins=0;lives=5;currentLevel=1;transitionLock=false;buildLevel(1,true);
  overlay.style.display='none';playToneNow(523,.08,'square',.05);startIntroScene();
}
function continueNext(){
  resetBirdSchedule();
  currentLevel++;transitionLock=false;buildLevel(currentLevel,true);
  overlay.style.display='none';running=true;startMusic();last=performance.now();requestAnimationFrame(loop);
}
async function unlockSound(){
  soundEnabled=true;
  soundBtn.disabled=true;
  soundBtn.textContent='🔊 ATTIVAZIONE...';

  const ok=await unlockAudio();
  if(ok){
    playToneNow(660,.10,'square',.07);
    setTimeout(()=>playToneNow(880,.12,'square',.07),90);
    soundBtn.textContent='🔊 SUONO ATTIVO';
  }else{
    soundBtn.textContent='🔇 TOCCA DI NUOVO';
  }
  soundBtn.disabled=false;
}

// Use only click: on iPhone/Safari this is a reliable explicit user gesture.
soundBtn.addEventListener('click',unlockSound);

startBtn.addEventListener('click',async()=>{
  // GIOCA itself also unlocks audio, so the extra sound button is optional.
  soundEnabled=true;
  const ok=await unlockAudio();
  if(ok)playToneNow(523,.10,'square',.055);

  if(startBtn.dataset.mode==='next'){
    startBtn.dataset.mode='';
    continueNext();
  }else{
    startFresh();
  }
});

function hold(id,key){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();keys[key]=true;el.classList.add('active')};
  const off=e=>{e.preventDefault();keys[key]=false;el.classList.remove('active')};
  ['pointerdown','touchstart'].forEach(ev=>el.addEventListener(ev,on,{passive:false}));
  ['pointerup','pointercancel','pointerleave','touchend','touchcancel'].forEach(ev=>el.addEventListener(ev,off,{passive:false}));
}

if(createAudio()){
  audioCtx.addEventListener('statechange',()=>{
    if(audioCtx.state==='running'){
      soundBtn.textContent='🔊 SUONO ATTIVO';
    }else if(audioCtx.state==='suspended'||audioCtx.state==='interrupted'){
      soundBtn.textContent='🔊 RIATTIVA SUONO';
    }
  });
}

hold('left','left');hold('right','right');hold('jump','jump');
addEventListener('keydown',e=>{if(e.code==='ArrowLeft')keys.left=true;if(e.code==='ArrowRight')keys.right=true;if(e.code==='Space'||e.code==='ArrowUp')keys.jump=true});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft')keys.left=false;if(e.code==='ArrowRight')keys.right=false;if(e.code==='Space'||e.code==='ArrowUp')keys.jump=false});

try{
  if('speechSynthesis' in window){
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
  }
}catch(e){}
</script>
